<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sellsembly Interactive Prototype</title>
<style>
:root{
  --navy:#0e4566; --navy2:#143b58; --teal:#0d9a90; --teal2:#dff4ef;
  --mint:#eaf7f2; --peach:#fff0ea; --blush:#fff5f1; --blue:#edf5fb;
  --cream:#fbfaf7; --ink:#18364d; --muted:#6b8190; --line:#dce7ea; --white:#fff;
  --shadow:0 14px 40px rgba(14,69,102,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f9fa;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}
.logo{font-size:31px;font-weight:850;color:var(--navy);letter-spacing:-1px;display:flex;gap:10px;align-items:center}
.logoMark{width:38px;height:38px;position:relative}
.logoMark:before,.logoMark:after{content:"";position:absolute;border:5px solid var(--teal);width:20px;height:20px;border-radius:7px}
.logoMark:before{left:1px;top:8px}.logoMark:after{right:1px;top:1px;border-color:#f4a995}
.tagline{font-size:10px;letter-spacing:.18em;color:var(--navy2);font-weight:800;margin:2px 0 26px 48px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;color:var(--navy2);text-align:left;padding:12px 13px;border-radius:11px;font-weight:650;display:flex;align-items:center;gap:10px}
.nav button:hover,.nav button.active{background:linear-gradient(90deg,#e4f5f0,#edf7f7);color:var(--navy)}
.nav .sep{height:1px;background:var(--line);margin:10px 0}
.sideQuote{position:absolute;bottom:25px;left:18px;right:18px;background:linear-gradient(140deg,#e8f7f2,#fff7f0);border-radius:18px;padding:16px;font-family:Georgia,serif;font-style:italic;color:var(--navy);font-size:16px;line-height:1.35}
.main{min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px;position:sticky;top:0;z-index:10}
.search{flex:1;max-width:650px;background:#f3f6f7;border:1px solid #e2e9eb;border-radius:12px;padding:12px 15px;color:#6f8793}
.profile{margin-left:auto;display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd8c8,#d8f4ed);display:grid;place-items:center;font-weight:800;color:var(--navy)}
.content{padding:28px;max-width:1420px;margin:0 auto}
.headerRow{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
h1{font-family:Georgia,serif;font-size:44px;line-height:1.05;color:var(--navy);margin:0 0 8px;letter-spacing:-1px}
h2,h3{color:var(--navy);margin:0}
.sub{color:#527084;font-size:17px}
.cta{border:0;background:linear-gradient(90deg,var(--navy),#006f75);color:white;padding:14px 20px;border-radius:14px;font-weight:800;box-shadow:0 8px 18px rgba(0,90,96,.16)}
.btn{border:1px solid #bdd4da;background:#fff;color:var(--navy);padding:11px 14px;border-radius:11px;font-weight:750}
.btn:hover{background:#f6fbfb}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat b{font-size:27px;color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel.pad{padding:20px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.productCard{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px}
.productCard img{width:100%;height:220px;object-fit:cover;background:#eef3f4}
.productCard .body{padding:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e6f6f2;color:#0d766f}
.muted{color:var(--muted)}
.link{color:var(--teal);font-weight:800}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.choice{padding:0;overflow:hidden;text-align:left;background:#fff;border:2px solid transparent;border-radius:20px;box-shadow:var(--shadow)}
.choice:hover{border-color:#8fd5ca;transform:translateY(-2px)}
.choice img{width:100%;height:220px;object-fit:cover;background:#f0f5f5}
.choice .copy{padding:18px}.choice h3{font-size:26px;margin-bottom:7px}.choice p{color:#567286;line-height:1.45}
.featureList{list-style:none;padding:0;margin:13px 0}.featureList li{margin:8px 0;color:#415f72}
.featureList li:before{content:"✓";color:var(--teal);font-weight:900;margin-right:8px}
.formGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.uploadBox{border:2px dashed #bcd5d9;border-radius:16px;padding:24px;text-align:center;background:#fafcfc}
.provider{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;display:flex;gap:10px;align-items:center}
.provider.selected{border-color:#51b9ae;background:#eefaf7}
.productOptions{display:flex;gap:10px;flex-wrap:wrap}.productOption{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.productOption.selected{border:2px solid var(--teal);background:#effaf7}
.label{font-size:13px;font-weight:800;color:#486679;margin-bottom:6px;display:block}
.input,.textarea{width:100%;border:1px solid #cfdcdf;border-radius:11px;padding:11px 12px;background:white;color:var(--ink)}
.textarea{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.progressWrap{max-width:820px;margin:35px auto}
.progressList{display:flex;flex-direction:column;gap:13px}
.progressItem{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:15px}
.progressDot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#edf3f5;font-weight:900;color:#8aa0aa}
.progressItem.done .progressDot{background:#dff6ef;color:#0e8d82}.progressItem.done{border-color:#cde8e2}
.bar{height:12px;background:#e8eef0;border-radius:999px;overflow:hidden;margin-top:18px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#0da89a,#2cc1ae);transition:width .5s}
.hubHero{display:grid;grid-template-columns:320px 1fr;gap:18px}.hubHero img{width:100%;height:300px;object-fit:cover;border-radius:16px}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.featurePanel{padding:20px;border-radius:18px;border:1px solid var(--line)}.featurePanel.sell{background:#fff3ee}.featurePanel.show{background:#effaf6}.featurePanel.promote{background:#f1f6fb}
.listingLayout{display:grid;grid-template-columns:280px 1fr 300px;gap:16px}
.priceBox{background:#effaf7;border-radius:14px;padding:15px;margin-top:14px}
.tagWrap{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#edf6fb;color:#315c78;padding:7px 10px;border-radius:999px;font-size:12px}
.readiness{font-size:42px;font-weight:900;color:var(--teal);text-align:center}
.imageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.thumb{border:2px solid transparent;border-radius:14px;overflow:hidden;background:#f6f8f8;cursor:pointer}.thumb.selected{border-color:#24a99d}.thumb img{width:100%;height:180px;object-fit:cover}.thumb div{padding:9px;font-weight:750}
.marketingGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pin{background:linear-gradient(180deg,#fff1ea,#fff);border-radius:13px;border:1px solid var(--line);padding:10px}.pin img{width:100%;height:220px;object-fit:cover;border-radius:9px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:800;color:#577080}.tabs button.active{color:var(--navy);border-bottom:3px solid var(--teal)}
.collectionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.collectionItem{border:2px solid transparent;background:white;border-radius:15px;overflow:hidden}.collectionItem.selected{border-color:#41b8ab}.collectionItem img{width:100%;height:180px;object-fit:cover;background:#f5f4f0}.collectionItem .body{padding:12px}
.summaryBox{position:sticky;top:92px}.split{display:grid;grid-template-columns:1fr 320px;gap:18px}
.digitalTabs{display:flex;gap:8px;flex-wrap:wrap}.digitalTabs button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.digitalTabs button.active{background:#e9f7f3;border-color:#74c9be}
.notice{padding:12px 14px;border-radius:12px;background:#eef8f5;color:#2c635e}
.modalBg{position:fixed;inset:0;background:rgba(7,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50}.modal{background:white;border-radius:18px;padding:24px;max-width:520px;width:92%;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.toast{position:fixed;right:20px;bottom:20px;background:#0e4566;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:70}
.mobileTop{display:none}
@media(max-width:1050px){
  .app{grid-template-columns:1fr}.sidebar{display:none}.mobileTop{display:flex;gap:8px;margin-bottom:15px}.grid4,.products,.choiceGrid,.triple{grid-template-columns:1fr 1fr}.listingLayout,.formGrid,.hubHero,.split{grid-template-columns:1fr}.marketingGrid{grid-template-columns:repeat(3,1fr)}.summaryBox{position:static}.collectionGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){.content{padding:18px}.topbar{padding:0 14px}.profile span{display:none}.grid4,.products,.choiceGrid,.triple,.row,.marketingGrid,.imageGrid,.collectionGrid{grid-template-columns:1fr}h1{font-size:35px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="logoMark"></span>Sellsembly</div>
    <div class="tagline">CREATE · ASSEMBLE · SELL</div>
    <nav class="nav" id="nav">
      <button data-page="dashboard">⌂ Dashboard</button>
      <button data-page="products">◫ My Products</button>
      <button data-page="add">⊕ Add Product</button>
      <button data-page="listing">▤ Listing Studio</button>
      <button data-page="images">▧ Image Studio</button>
      <button data-page="marketing">◖ Marketing Kit</button>
      <button data-page="collection">▱ Collection Builder</button>
      <div class="sep"></div>
      <button onclick="toast('Brand settings are simulated in this prototype.')">⚙ Brand Settings</button>
      <button onclick="toast('Integrations are simulated in this prototype.')">↗ Integrations</button>
      <button onclick="toast('Help center coming soon.')">? Help & Resources</button>
    </nav>
    <div class="sideQuote">Same creativity.<br>Less chaos.<br>More sales. ♡</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <input class="search" placeholder="Search your products, listings, or help...">
      <div class="profile"><div class="avatar">A</div><span><b>Hi, Adara!</b><br><small class="muted">Ramble Rose Creations</small></span></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div class="modalBg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

 <div class="marketingGrid">${[1,2,3,4,5].map((n,i)=>`<div class="pin"><img src="${POD_IMG}"><h3>${["Main Pin","Lifestyle Pin","Quote Pin","Gift Pin","Text Pin"][i]}</h3><button class="btn" style="width:100%" onclick="toast('Downloaded (simulated).')">Download</button></div>`).join("")}</div>
 <div class="sectionTitle"><h2>Launch Checklist</h2></div><div class="panel pad"><ul class="featureList"><li>Listing is complete</li><li>Images are ready</li><li>Pinterest pins created</li><li>Instagram posts created</li><li>Reel/TikTok ideas ready</li></ul><button class="cta" onclick="toast('Launch plan opened.')">View Full Launch Plan →</button></div>`;

function tab(el){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));el.classList.add("active");toast(el.textContent+" tab selected")}
function collection(){
 const items=[["Pickleball Paddle",POD_IMG,"49.95"],["T-Shirt",POD_IMG,"24.99"],["Sweatshirt",POD_IMG,"39.99"],["Mug",POD_IMG,"14.99"],["Tote Bag",POD_IMG,"24.99"],["Pillow",POD_IMG,"27.99"]];
 return header("Collection Builder","Turn one design into a collection of products — and reach more customers with less effort.")
 + `<div class="split"><div><div class="collectionGrid">${items.map(([name,img,price])=>`<button class="collectionItem ${state.selectedProducts.has(name)?'selected':''}" onclick="toggleProduct('${name}',this)"><img src="${img}"><div class="body"><h3>${name}</h3><div class="muted">Est. retail: $${price}</div><span class="badge">${state.selectedProducts.has(name)?'Selected':'Select'}</span></div></button>`).join("")}</div></div>
 <div class="panel pad summaryBox"><h2>Your Collection Summary</h2><p><b id="selCount">${state.selectedProducts.size}</b> products selected</p><p><b id="listingCount">${state.selectedProducts.size}</b> marketplace listings</p><p><b id="imgCount">${state.selectedProducts.size*10}+</b> listing images</p><p><b id="mktCount">${state.selectedProducts.size}</b> marketing kits</p><button class="cta" style="width:100%" onclick="modal('<h2>Collection queued! ✨</h2><p>In the real Sellsembly, your selected products would now be assembled into listings, images, and marketing kits.</p><button class=&quot;cta&quot; onclick=&quot;closeModal();navTo(\\'producthub\\')&quot;>Back to Product Hub</button>')">Create My Collection →</button></div></div>`;
}
function toggleProduct(name,el){if(state.selectedProducts.has(name))state.selectedProducts.delete(name);else state.selectedProducts.add(name);el.classList.toggle("selected");render()}

function maker(){

function render(){
 document.querySelectorAll("#nav [data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))
 let map={dashboard,products,add:addProduct,podsetup:podSetup,assemble,producthub:productHub,listing,images,marketing,collection,digitalhub: digitalHub,maker}
 document.getElementById("content").innerHTML=(map[state.page]||dashboard)()
 window.scrollTo({top:0,behavior:"smooth"})
}
render();
